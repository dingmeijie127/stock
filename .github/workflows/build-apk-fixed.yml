name: Build TideQuant Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'app/**'
      - 'research/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
  pull_request:
    paths:
      - '.github/workflows/build-apk.yml'
      - 'app/**'
      - 'research/**'
      - 'build.gradle'
      - 'settings.gradle'

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android platform
        run: |
          sdkmanager --version
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
          sdkmanager --list_installed | grep -E 'platforms;android-35|build-tools;35\.0\.0|platform-tools' || true
      # The repository intentionally has no gradle-wrapper.jar. Setup Gradle installs
      # an exact compatible binary, so GitHub Actions can build without ./gradlew.
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Python offline research regression tests
        run: |
          python3 -m pip install --disable-pip-version-check --quiet numpy pandas pytest
          python3 -m pytest research/tests -q
      - name: Sanity checks
        run: |
          python3 -m compileall -q research
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/sqlite_import.js
          node --check app/src/main/assets/research_view.js
      - name: Compile debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TideQuant-v0.3-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  build-release:
    # Optional, only on main/master and only if user provides own signing key.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SIGNING_READY: ${{ secrets.TIDE_KEYSTORE_BASE64 != '' && secrets.TIDE_STORE_PASSWORD != '' && secrets.TIDE_KEY_ALIAS != '' && secrets.TIDE_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - run: |
          sdkmanager --version
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
          sdkmanager --list_installed | grep -E 'platforms;android-35|build-tools;35\.0\.0|platform-tools' || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Sign release APK with your own keystore
        if: env.SIGNING_READY == 'true'
        env:
          KEY_B64: ${{ secrets.TIDE_KEYSTORE_BASE64 }}
          TIDE_STORE_PASSWORD: ${{ secrets.TIDE_STORE_PASSWORD }}
          TIDE_KEY_ALIAS: ${{ secrets.TIDE_KEY_ALIAS }}
          TIDE_KEY_PASSWORD: ${{ secrets.TIDE_KEY_PASSWORD }}
        shell: bash
        run: |
          umask 077
          echo "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/tide-signing.jks"
          export TIDE_KEYSTORE_PATH="$RUNNER_TEMP/tide-signing.jks"
          gradle --no-daemon --stacktrace :app:assembleRelease
          rm -f "$TIDE_KEYSTORE_PATH"
      - name: Upload signed release APK
        if: env.SIGNING_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: TideQuant-v0.3-release-signed
          path: app/build/outputs/apk/release/*-release.apk
          if-no-files-found: error
          retention-days: 30
