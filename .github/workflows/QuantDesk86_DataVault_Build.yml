name: QuantDesk V8.6 - DataVault Full Market APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find full source ZIP and unpack safely
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os, zipfile, tempfile
          root = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          target = root / 'QuantDesk86_DataVault_Source.zip'
          def valid(folder):
              return all((folder / r).is_file() for r in (
                  'collector/pyproject.toml',
                  'android-app/settings.gradle',
                  'android-app/app/src/main/java/com/quantdesk/v85/NativeCollector.java',
                  'android-app/app/src/main/java/com/quantdesk/v85/VaultDb.java',
                  'tests/MarketRulesTest.java'))
          def locate(folder):
              if valid(folder): return folder
              return next((p.parent.parent for p in folder.rglob('collector/pyproject.toml') if valid(p.parent.parent)), None)
          path=None
          if target.exists():
              path=target
          else:
              path=locate(root)
              if path is None:
                  for candidate in root.glob('*.zip'):
                      try:
                          with zipfile.ZipFile(candidate) as z:
                              names=set(z.namelist())
                              if any(x.endswith('collector/pyproject.toml') for x in names) and any(x.endswith('NativeCollector.java') for x in names):
                                  path=candidate
                                  break
                      except zipfile.BadZipFile: pass
          if path is None:raise SystemExit('::error::No valid source found. Upload QuantDesk86_DataVault_Source.zip to the repository root.')
          if path.suffix.lower()=='.zip':
              extracted=Path(tempfile.mkdtemp(prefix='quantdesk86-',dir=os.environ['RUNNER_TEMP']))
              with zipfile.ZipFile(path) as z:
                  for item in z.infolist():
                      rel=Path(item.filename)
                      if rel.is_absolute() or '..' in rel.parts or item.filename.startswith('\\'):
                          raise SystemExit('::error::Source ZIP contains unsafe file paths')
                  z.extractall(extracted)
              path=locate(extracted)
          if not path or not valid(path):raise SystemExit('::error::ZIP does not contain required Android native downloader and collector modules.')
          print(f'Validated project: {path}')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as out:out.write('PROJECT_ROOT='+str(path)+'\n')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test native market data validation in JVM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-classes"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/native-classes" \
            "$PROJECT_ROOT/android-app/app/src/main/java/com/quantdesk/v85/MarketRules.java" \
            "$PROJECT_ROOT/tests/MarketRulesTest.java"
          java -cp "$RUNNER_TEMP/native-classes" MarketRulesTest

      - name: Install collector and run Python tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e "$PROJECT_ROOT/collector" pytest httpx
          python -m pytest -q "$PROJECT_ROOT/tests"

      - name: Run app JavaScript regression tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          node --test tests/*.test.cjs

      - name: Install Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android 35 API and build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Configure Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build full-market downloader APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT/android-app"
          gradle --no-daemon --stacktrace :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/QuantDesk-V8.6-DataVault-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuantDesk-V8.6-DataVault-APK
          path: QuantDesk-V8.6-DataVault-debug.apk
          if-no-files-found: error
          retention-days: 14
