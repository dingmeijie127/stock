name: TideQuant Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tidequant-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Confirm Android project files
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/cn/tidelab/quantpilot/MainActivity.java
          test -f app/src/main/java/cn/tidelab/quantpilot/SqliteImportEngine.java
          test -f app/src/main/assets/index.html
          test -f app/src/main/assets/app.js

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK setup - no deprecated tools package
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          sdkmanager --list_installed

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check JavaScript
        shell: bash
        run: |
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/sqlite_import.js
          node --check app/src/main/assets/research_view.js

      - name: Compile standalone APK
        shell: bash
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Publish installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TideQuant-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Python for research tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check backtesting engine (synthetic tests only)
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --quiet numpy pandas pytest
          python -m pytest research/tests -q
