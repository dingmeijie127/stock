name: TideQuant V0.5.3 | Build APK
run-name: V0.5.3 | ${{ github.event_name }} | ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'TideQuant-v0.5.3-Android-Project.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

env:
  SOURCE_ZIP: TideQuant-v0.5.3-Android-Project.zip

jobs:
  build-debug-v053:
    name: BUILD-APK-v053
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: VERIFY-V053-ZIP-and-extract-Android-project
        shell: bash
        run: |
          set -euo pipefail
          echo '::notice::TIDEQUANT V0.5.3 WORKFLOW IS ACTIVE'
          echo "COMMIT=$GITHUB_SHA"
          echo "REPOSITORY=$GITHUB_REPOSITORY"
          echo 'Root files:'
          ls -la
          archive="$GITHUB_WORKSPACE/$SOURCE_ZIP"
          if [[ ! -s "$archive" ]]; then
            echo "::error::Missing $SOURCE_ZIP in repository root. Do not upload the outer OneDownload ZIP."
            exit 1
          fi
          unzip -tq "$archive" >/dev/null
          mkdir -p "$RUNNER_TEMP/tq-v053"
          unzip -q "$archive" -d "$RUNNER_TEMP/tq-v053"
          mapfile -t roots < <(find "$RUNNER_TEMP/tq-v053" -maxdepth 6 -type f -name settings.gradle -print)
          if [[ "${#roots[@]}" -ne 1 ]]; then
            echo "::error::Expected one Android settings.gradle, found ${#roots[@]}"
            find "$RUNNER_TEMP/tq-v053" -maxdepth 3 -type f | head -60
            exit 1
          fi
          root="$(cd "$(dirname "${roots[0]}")" && pwd -P)"
          test -s "$root/app/build.gradle"
          test -s "$root/app/src/main/AndroidManifest.xml"
          test -s "$root/research/tests/test_engine.py"
          grep -Fq "versionName '0.5.3-github-pathfix'" "$root/app/build.gradle" || {
            echo '::error::ZIP contains wrong application version, require 0.5.3-github-pathfix'; exit 1;
          }
          grep -Eq "applicationId ['\"]cn\.tidelab\.quantpilot['\"]" "$root/app/build.gradle"
          echo "PROJECT_ROOT=$root" >> "$GITHUB_ENV"
          echo "::notice::Extracted source at $root; running V0.5.3 build"

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Android assets
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/sqlite_import.js
          node --check app/src/main/assets/research_view.js
          node research/tests/app_smoke.js

      - name: COMPILE-APK-V053
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          gradle --no-daemon --stacktrace :app:assembleDebug
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk" || { echo '::error::Gradle did not create app-debug.apk'; exit 1; }
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -F "package: name='cn.tidelab.quantpilot'"
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp "$apk" "$GITHUB_WORKSPACE/apk-output/TideQuant-v0.5.3-debug.apk"
          sha256sum "$GITHUB_WORKSPACE/apk-output/TideQuant-v0.5.3-debug.apk"
          ls -lh "$GITHUB_WORKSPACE/apk-output/"

      - name: PUBLISH-APK-V053
        uses: actions/upload-artifact@v4
        with:
          name: TideQuant-v0.5.3-Debug-APK
          path: apk-output/TideQuant-v0.5.3-debug.apk
          if-no-files-found: error
          retention-days: 30

  research-tests-v053:
    name: RESEARCH-TESTS-v053 (separate from APK build)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: VERIFY-V053-TEST-PATH
        shell: bash
        run: |
          set -euo pipefail
          archive="$GITHUB_WORKSPACE/$SOURCE_ZIP"
          test -s "$archive" || { echo "::error::Missing $SOURCE_ZIP"; exit 1; }
          mkdir -p "$RUNNER_TEMP/tq-v053-test"
          unzip -q "$archive" -d "$RUNNER_TEMP/tq-v053-test"
          mapfile -t roots < <(find "$RUNNER_TEMP/tq-v053-test" -maxdepth 6 -type f -name settings.gradle -print)
          test "${#roots[@]}" -eq 1 || { echo '::error::Invalid source ZIP'; exit 1; }
          root="$(cd "$(dirname "${roots[0]}")" && pwd -P)"
          test -f "$root/research/tests/test_engine.py" || { echo "::error::research/tests is absent at $root"; exit 1; }
          echo "PROJECT_ROOT=$root" >> "$GITHUB_ENV"
          echo "Research directory: $root/research/tests"
      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run extracted-source tests (NOT required for APK artifact)
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          echo "Running tests from $(pwd)"
          python -m pip install --disable-pip-version-check --quiet -r requirements-research.txt
          python -m pytest -q research/tests
